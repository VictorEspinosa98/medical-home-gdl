[build]
  command = "pnpm run build"
  publish = "out"

[build.environment]
  NODE_VERSION            = "24"
  PNPM_VERSION            = "10"
  NEXT_TELEMETRY_DISABLED = "1"

# ─────────────────────────────────────────────────────────────────────────────
# Cache. Netlify sirve todo con `max-age=0, must-revalidate` por defecto:
# sin estas reglas, cada visita repetida revalida absolutamente todo y los
# Core Web Vitals se caen. Los nombres llevan content-hash, así que
# `immutable` es seguro.
# ─────────────────────────────────────────────────────────────────────────────

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type  = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type  = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type  = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    X-Frame-Options        = "SAMEORIGIN"
    Permissions-Policy     = "geolocation=(), camera=(), microphone=(), interest-cohort=()"

# NOTA: añadir HSTS solo DESPUÉS de confirmar que HTTPS funciona en apex y www.
# Sin `preload` al inicio — es muy difícil de revertir.
#   Strict-Transport-Security = "max-age=31536000; includeSubDomains"
